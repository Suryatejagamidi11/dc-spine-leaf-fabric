! ============================================================
! LEAF-3 - Nexus 93180YC-EX
! Role: Standalone leaf (no vPC) - lower-redundancy rack
! ============================================================

hostname LEAF-3

feature ospf
feature interface-vlan

interface loopback0
  description Leaf-3 Router ID
  ip address 10.255.0.13/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/49
  description To SPINE-1 Eth1/3
  no switchport
  ip address 10.255.1.5/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

interface Ethernet1/50
  description To SPINE-2 Eth1/3
  no switchport
  ip address 10.255.2.5/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

router ospf UNDERLAY
  router-id 10.255.0.13
  log-adjacency-changes
  passive-interface default
  no passive-interface Ethernet1/49
  no passive-interface Ethernet1/50

! ------------------------------------------------------------
! Server-facing (single-homed - no vPC redundancy on this leaf)
! ------------------------------------------------------------
interface Ethernet1/1
  description Server Rack C - single-homed
  switchport
  switchport mode access
  switchport access vlan 120
  no shutdown

interface Vlan120
  description Server Rack C Gateway
  no shutdown
  ip address 10.10.2.1/24
