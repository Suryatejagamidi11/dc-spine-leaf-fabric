! ============================================================
! LEAF-1 - Nexus 93180YC-EX
! Role: Server/rack-facing leaf, vPC peer with LEAF-2
! ============================================================

hostname LEAF-1

feature ospf
feature vpc
feature lacp
feature interface-vlan
feature hsrp

! --- Loopback for OSPF router-id ---
interface loopback0
  description Leaf-1 Router ID
  ip address 10.255.0.11/32
  ip router ospf UNDERLAY area 0.0.0.0

! ------------------------------------------------------------
! vPC domain and peer relationship with LEAF-2
! ------------------------------------------------------------
vpc domain 10
  peer-switch
  role priority 100
  peer-keepalive destination 10.1.1.2 source 10.1.1.1
  delay restore 150
  peer-gateway
  ip arp synchronize
  auto-recovery

! Peer-keepalive uses out-of-band mgmt, not the data plane
interface mgmt0
  description vPC Peer-Keepalive Link
  ip address 10.1.1.1/30
  vrf member management

! Peer-link: carries vPC control traffic + VLANs between the two leaf switches.
! Must be at least 2 physical links bundled for redundancy.
interface Ethernet1/47
  description vPC Peer-Link to LEAF-2 Eth1/47
  switchport
  switchport mode trunk
  channel-group 10 mode active

interface Ethernet1/48
  description vPC Peer-Link to LEAF-2 Eth1/48
  switchport
  switchport mode trunk
  channel-group 10 mode active

interface port-channel10
  description vPC Peer-Link
  switchport
  switchport mode trunk
  spanning-tree port type network
  vpc peer-link

! ------------------------------------------------------------
! Uplinks to spines (routed, part of the OSPF underlay/ECMP)
! ------------------------------------------------------------
interface Ethernet1/49
  description To SPINE-1 Eth1/1
  no switchport
  ip address 10.255.1.1/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

interface Ethernet1/50
  description To SPINE-2 Eth1/1
  no switchport
  ip address 10.255.2.1/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

router ospf UNDERLAY
  router-id 10.255.0.11
  log-adjacency-changes
  passive-interface default
  no passive-interface Ethernet1/49
  no passive-interface Ethernet1/50

! ------------------------------------------------------------
! Server-facing vPC (Server Rack A, dual-homed to LEAF-1 + LEAF-2)
! ------------------------------------------------------------
interface Ethernet1/1
  description Server Rack A - link 1 (vPC)
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 110
  channel-group 101 mode active

interface port-channel101
  description vPC to Server Rack A
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 110
  vpc 101

! ------------------------------------------------------------
! SVI for server VLAN - HSRP provides the anycast-style default gateway
! (peer-gateway above lets each leaf locally handle traffic destined to
! the peer's HSRP MAC, avoiding unnecessary trips across the peer-link)
! ------------------------------------------------------------
interface Vlan110
  description Server Rack A Gateway
  no shutdown
  ip address 10.10.0.2/24
  hsrp 110
    priority 110
    ip 10.10.0.1
