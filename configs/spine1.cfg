! ============================================================
! SPINE-1 - Nexus 9336C-FX2
! Role: L3 transit only. No server-facing ports. No vPC.
! ============================================================

hostname SPINE-1

feature ospf
feature interface-vlan
feature lacp

! --- Loopback for OSPF router-id and reachability ---
interface loopback0
  description Spine-1 Router ID
  ip address 10.255.0.1/32
  ip router ospf UNDERLAY area 0.0.0.0

! --- Uplinks to each leaf (routed point-to-point, /31s to conserve space) ---
interface Ethernet1/1
  description To LEAF-1 Eth1/49
  no switchport
  ip address 10.255.1.0/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

interface Ethernet1/2
  description To LEAF-2 Eth1/49
  no switchport
  ip address 10.255.1.2/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

interface Ethernet1/3
  description To LEAF-3 Eth1/49
  no switchport
  ip address 10.255.1.4/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

! --- OSPF underlay process ---
router ospf UNDERLAY
  router-id 10.255.0.1
  log-adjacency-changes
  ! Point-to-point interfaces = fast convergence, no DR/BDR election needed
  passive-interface default
  no passive-interface Ethernet1/1
  no passive-interface Ethernet1/2
  no passive-interface Ethernet1/3

! --- ECMP: allow up to 3 equal-cost paths (one per leaf uplink is irrelevant here;
!     this matters when spine has multiple paths to the same destination leaf,
!     e.g. via a second spine acting as an alternate path in larger fabrics) ---
ip load-sharing address source-destination
