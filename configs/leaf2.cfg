! ============================================================
! LEAF-2 - Nexus 93180YC-EX
! Role: Server/rack-facing leaf, vPC peer with LEAF-1
! ============================================================

hostname LEAF-2

feature ospf
feature vpc
feature lacp
feature interface-vlan
feature hsrp

interface loopback0
  description Leaf-2 Router ID
  ip address 10.255.0.12/32
  ip router ospf UNDERLAY area 0.0.0.0

! ------------------------------------------------------------
! vPC domain - secondary role (lower priority = LEAF-1 stays primary)
! ------------------------------------------------------------
vpc domain 10
  peer-switch
  role priority 200
  peer-keepalive destination 10.1.1.1 source 10.1.1.2
  delay restore 150
  peer-gateway
  ip arp synchronize
  auto-recovery

interface mgmt0
  description vPC Peer-Keepalive Link
  ip address 10.1.1.2/30
  vrf member management

interface Ethernet1/47
  description vPC Peer-Link to LEAF-1 Eth1/47
  switchport
  switchport mode trunk
  channel-group 10 mode active

interface Ethernet1/48
  description vPC Peer-Link to LEAF-1 Eth1/48
  switchport
  switchport mode trunk
  channel-group 10 mode active

interface port-channel10
  description vPC Peer-Link
  switchport
  switchport mode trunk
  spanning-tree port type network
  vpc peer-link

! ------------------------------------------------------------
! Uplinks to spines
! ------------------------------------------------------------
interface Ethernet1/49
  description To SPINE-1 Eth1/2
  no switchport
  ip address 10.255.1.3/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

interface Ethernet1/50
  description To SPINE-2 Eth1/2
  no switchport
  ip address 10.255.2.3/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

router ospf UNDERLAY
  router-id 10.255.0.12
  log-adjacency-changes
  passive-interface default
  no passive-interface Ethernet1/49
  no passive-interface Ethernet1/50

! ------------------------------------------------------------
! Server-facing vPC (Server Rack A, other leg)
! ------------------------------------------------------------
interface Ethernet1/1
  description Server Rack A - link 2 (vPC)
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 110
  channel-group 101 mode active

interface port-channel101
  description vPC to Server Rack A
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 110
  vpc 101

interface Vlan110
  description Server Rack A Gateway
  no shutdown
  ip address 10.10.0.3/24
  hsrp 110
    priority 90
    ip 10.10.0.1
