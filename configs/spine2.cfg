! ============================================================
! SPINE-2 - Nexus 9336C-FX2
! Role: L3 transit only. No server-facing ports. No vPC.
! ============================================================

hostname SPINE-2

feature ospf
feature interface-vlan
feature lacp

interface loopback0
  description Spine-2 Router ID
  ip address 10.255.0.2/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/1
  description To LEAF-1 Eth1/50
  no switchport
  ip address 10.255.2.0/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

interface Ethernet1/2
  description To LEAF-2 Eth1/50
  no switchport
  ip address 10.255.2.2/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

interface Ethernet1/3
  description To LEAF-3 Eth1/50
  no switchport
  ip address 10.255.2.4/31
  ip router ospf UNDERLAY area 0.0.0.0
  mtu 9216
  no shutdown

router ospf UNDERLAY
  router-id 10.255.0.2
  log-adjacency-changes
  passive-interface default
  no passive-interface Ethernet1/1
  no passive-interface Ethernet1/2
  no passive-interface Ethernet1/3

ip load-sharing address source-destination
